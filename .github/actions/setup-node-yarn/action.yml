name: Set up Node and Yarn dependencies
description: Use the repository runtime pin and frozen Yarn Classic lockfile

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Enable and verify pinned Yarn
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        corepack enable
        expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        actual="$(yarn --version)"
        test "$actual" = "$expected"
        test "$(node --version)" = "v$(cat .nvmrc)"

    - name: Locate Yarn download cache
      id: yarn-cache
      shell: bash
      working-directory: ${{ github.workspace }}
      run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Yarn downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('.nvmrc', 'package.json', 'yarn.lock') }}

    - name: Install locked workspace dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # Use the optional Sharp/libvips binaries recorded in yarn.lock.
        SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      run: yarn install --frozen-lockfile --non-interactive
