name: Notify Popular Repositories

on:
  schedule:
    - cron: '58 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and locked dependencies
        uses: ./.github/actions/setup-node-yarn

      - name: Set up environment variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_DAILY_TABLE_NAME=${{ secrets.SUPABASE_DAILY_TABLE_NAME }}" >> $GITHUB_ENV
          echo "GIT_REPOSITORY_FEED_URL=${{ secrets.GIT_REPOSITORY_FEED_URL }}" >> $GITHUB_ENV
          echo "ERROR_WEBHOOK_URL=${{ secrets.ERROR_WEBHOOK_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_EMAIL=${{ secrets.SUPABASE_EMAIL }}" >> $GITHUB_ENV
          echo "SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}" >> $GITHUB_ENV
          echo "DISCORD_DAILY_WEBHOOK_URL=${{ secrets.DISCORD_DAILY_WEBHOOK_URL }}" >> $GITHUB_ENV
        
      - name: Run Notify Popular Repositories
        run: |
          node index.js
        working-directory: packages/getPopularRepositories
